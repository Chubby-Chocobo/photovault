# Build and test on macOS. Runs on pull requests and release branches, and is called by the
# git workflow's verify job before a release is tagged. Private repo: macOS minutes are billed
# at 10x, so this stays one job and cancels superseded pull request runs. Pushes and calls from the
# git workflow get one group per commit: a later push must never cancel the run a release tag waits on.
name: CI

on:
  pull_request:
  push:
    branches: ['release/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Detect app changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(PhotoVault/|PhotoVault\.xcodeproj/|Config/|Package\.|Sources/)'; then
              echo "app=true" >> "$GITHUB_OUTPUT"
            else
              echo "app=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build package
        run: swift build
      # Complete RAW files too large for git: listed with checksums in the test manifest, cached
      # under its hash, so a download only happens when the manifest changes.
      - name: Restore media corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .media-corpus
          key: media-corpus-${{ hashFiles('Tests/PhotoVaultPhotosTests/Fixtures/MediaCorpus/manifest.json') }}
      - name: Fetch media corpus
        run: python3 -I scripts/fetch-media-corpus.py .media-corpus
      - name: Test package
        env:
          PHOTOVAULT_MEDIA_CORPUS: ${{ github.workspace }}/.media-corpus
        run: swift test
      - name: Build app (unsigned)
        if: steps.changes.outputs.app == 'true'
        run: >
          xcodebuild -project PhotoVault.xcodeproj -scheme PhotoVault -configuration Debug build
          CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData -skipPackagePluginValidation
